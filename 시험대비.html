<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>항해·법규·기관 문제풀이</title>
<style>
/* ============================================================
   색·크기·굵기는 모두 디자인.md 에서 가져왔다.
   여기서 새 값을 만들지 않는다.
   인터넷에서 아무것도 불러오지 않는다 — 글꼴은 기기에 있는 것만 쓴다.
   ============================================================ */

:root {
  /* 디자인.md 1장 — 밝은 화면 */
  --ground: #EEF1F5;
  --surface: #FFFFFF;
  --surface-alt: #F7F9FB;
  --ink: #1C2530;
  --ink-soft: #55616F;
  --ink-faint: #66737F;
  --accent: #1B6FB8;
  --navy: #10335E;
  --navy-deep: #0A2342;
  --ok: #1B6E43;
  --ok-wash: #E7F3EC;
  --bad: #B5342B;
  --bad-wash: #FBEAE8;
  --warn: #9C6B12;
  --warn-wash: #FBF2DF;
  --line: #D5DCE4;
  --line-soft: #E6EBF0;
  --on-accent: #FFFFFF;

  /* 디자인.md 2장 — 글자 크기 */
  --t-site: 26px;
  --t-box: 15px;
  --t-question: 17px;
  --t-body: 15px;
  --t-note: 13px;
  --t-meta: 12px;

  --rad: 3px;

  --sans: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Nanum Gothic", system-ui, -apple-system, sans-serif;
  --mono: Consolas, "D2Coding", "Courier New", monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    /* 디자인.md 1장 — 어두운 화면. 밝은 값을 뒤집지 않고 짝을 바꿔 쓴다. */
    --ground: #0D1419;
    --surface: #151E26;
    --surface-alt: #18232C;
    --ink: #E3E9EF;
    --ink-soft: #9BA8B6;
    --ink-faint: #8C99A6;
    --accent: #64A9DF;
    --navy: #16283C;
    --navy-deep: #0E1B28;
    --ok: #5BBE8B;
    --ok-wash: #11291E;
    --bad: #E77A72;
    --bad-wash: #2C1615;
    --warn: #D6A443;
    --warn-wash: #2B2213;
    --line: #27333E;
    --line-soft: #1E2933;
    --on-accent: #08131D;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: var(--t-body);
  font-weight: 400;
  line-height: 1.65;
}

button, input { font-family: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* 디자인.md 6장 — 동작 줄이기를 켜 두면 움직임을 전부 멈춘다 */
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---------- 상단 남색 띠 ---------- */

.topbar { background: var(--navy); color: #FFFFFF; border-bottom: 3px solid var(--accent); }
.topbar .in { max-width: 760px; margin: 0 auto; padding: 14px 18px; }
.topbar h1 { margin: 0; font-size: var(--t-site); font-weight: 700; }
.topbar p { margin: 2px 0 0; font-size: var(--t-note); color: #C3D2E2; }

/* ---------- 본문 ---------- */

.wrap { max-width: 760px; margin: 0 auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }

/* 디자인.md 3장 — 문제 하나가 흰 상자 하나를 차지한다. 그림자 없음, 테두리 1px, 반지름 3px */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--rad); }

.panel-head {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 14px; background: var(--surface-alt);
  border-bottom: 1px solid var(--line);
  border-radius: var(--rad) var(--rad) 0 0;
}
.panel-head::before { content: ""; width: 3px; height: 13px; background: var(--accent); flex: none; }
.panel-head h2 { margin: 0; font-size: var(--t-box); font-weight: 600; }
.panel-head .aside { margin-left: auto; font-size: var(--t-meta); font-weight: 500; color: var(--ink-faint); }

.panel-body { padding: 14px; }

/* ---------- 진행 줄 ---------- */

.progress {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 9px 14px; background: var(--surface-alt); border-bottom: 1px solid var(--line);
  font-size: var(--t-meta); font-weight: 500; color: var(--ink-soft);
  font-family: var(--mono);
}
.progress .track { flex: 1; min-width: 110px; height: 5px; background: var(--line-soft); border-radius: 999px; overflow: hidden; }
/* 디자인.md 6장 — 허용된 움직임은 진행 줄 채워짐뿐이고 0.25초 이하 */
.progress .track > i { display: block; height: 100%; background: var(--accent); transition: width .25s; }

/* ---------- 문제 ---------- */

.badge {
  display: inline-block; font-size: var(--t-meta); font-weight: 500;
  border: 1px solid var(--line); background: var(--surface-alt); color: var(--ink-soft);
  padding: 2px 9px; border-radius: 999px;
}
.badge.b-choice { border-color: var(--accent); color: var(--accent); }
.badge.b-ox { border-color: var(--warn); color: var(--warn); background: var(--warn-wash); }
.badge.b-short { border-color: var(--ok); color: var(--ok); background: var(--ok-wash); }

/* 디자인.md 2장 — 문제 문장 17px / 굵기 500 */
.question { font-size: var(--t-question); font-weight: 500; margin: 12px 0 16px; line-height: 1.6; overflow-wrap: anywhere; }
.question .blank { font-family: var(--mono); color: var(--accent); }

/* 디자인.md 3장 — 보기는 세로로 쌓고, 간격 6px, 한 칸 40px 이상 */
.choices { display: flex; flex-direction: column; gap: 6px; }
.choice {
  display: flex; align-items: baseline; gap: 10px;
  min-height: 40px; width: 100%; text-align: left;
  padding: 10px 13px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--rad);
  font-size: var(--t-body); font-weight: 400; cursor: pointer;
  overflow-wrap: anywhere;
}
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice:disabled { cursor: default; }
.choice .ix { font-family: var(--mono); font-size: var(--t-note); color: var(--ink-faint); flex: none; }

/* 디자인.md 4장 — 고른 보기와 정답 보기를 각각 표시한다 */
.choice.pick-right { border-color: var(--ok); background: var(--ok-wash); }
.choice.pick-wrong { border-color: var(--bad); background: var(--bad-wash); }
.choice.show-answer { border-color: var(--ok); }

/* 디자인.md 3장 — OX만 가로로 둘, 폭을 절반씩 */
.ox { display: flex; gap: 6px; }
.ox .choice { justify-content: center; font-family: var(--mono); font-size: 20px; font-weight: 500; }

.short-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
input[type="text"] {
  flex: 1; min-width: 200px; min-height: 40px;
  padding: 8px 10px; font-size: var(--t-body);
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--rad);
}
input[type="text"]:focus { border-color: var(--accent); }

/* ---------- 채점 결과 ---------- */
/* 디자인.md 3장 — 결과는 문제 아래에 붙인다. 떠 있는 창으로 띄우지 않는다 */

.verdict { margin-top: 16px; border: 1px solid var(--line); border-radius: var(--rad); overflow: hidden; }
.verdict .vh { padding: 8px 13px; font-size: var(--t-note); font-weight: 600; }
.verdict.right .vh { background: var(--ok-wash); color: var(--ok); border-bottom: 1px solid var(--ok); }
.verdict.wrong .vh { background: var(--bad-wash); color: var(--bad); border-bottom: 1px solid var(--bad); }
.verdict .vb { padding: 12px 13px; display: flex; flex-direction: column; gap: 7px; font-size: var(--t-note); }

.line { color: var(--ink-soft); overflow-wrap: anywhere; }
.line .ans { color: var(--ok); font-weight: 600; }
.line .mine { color: var(--bad); text-decoration: line-through; }
.why { color: var(--ink-soft); overflow-wrap: anywhere; }
/* 출처는 곁 정보 — 디자인.md 1장의 곁 정보 색을 쓴다 */
.src { color: var(--ink-faint); font-size: var(--t-meta); font-weight: 500; overflow-wrap: anywhere; }
.rule { color: var(--ink-faint); font-size: var(--t-meta); }
.nodata { color: var(--warn); font-weight: 600; }

/* ---------- 버튼 ---------- */
/* 디자인.md 5장 — 직사각형, 반지름 3px, 높이 36px 이상, 13px/500, 상자 맨 아래 왼쪽부터 */

.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.btn {
  min-height: 36px; padding: 8px 14px;
  font-size: var(--t-note); font-weight: 500;
  border: 1px solid var(--line); border-radius: var(--rad);
  background: var(--surface); color: var(--ink); cursor: pointer;
}
.btn:hover:not(:disabled) { background: var(--surface-alt); border-color: var(--ink-faint); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); }
.btn-text { border-color: transparent; background: none; color: var(--accent); }
.btn-text:hover:not(:disabled) { background: var(--surface-alt); border-color: transparent; }

/* ---------- 결과 화면 ---------- */

.score { display: flex; align-items: baseline; gap: 8px; font-family: var(--mono); }
.score b { font-size: 32px; font-weight: 600; color: var(--accent); }
.score span { color: var(--ink-soft); font-size: var(--t-body); }

.review { list-style: none; margin: 14px 0 0; padding: 0; }
.review > li { border-top: 1px solid var(--line-soft); padding: 13px 0; display: flex; flex-direction: column; gap: 6px; }
.review > li:first-child { border-top: 0; padding-top: 0; }
.review .rq { font-size: var(--t-body); font-weight: 500; overflow-wrap: anywhere; }

.note { font-size: var(--t-note); color: var(--ink-soft); }
.note b { color: var(--ink); }

/* ---------- 바닥 ---------- */

.foot { background: var(--navy-deep); color: #92A6BB; margin-top: 8px; }
.foot .in { max-width: 760px; margin: 0 auto; padding: 16px 18px 22px; font-size: var(--t-note); display: flex; flex-direction: column; gap: 4px; }
.foot b { color: #C8D6E4; font-weight: 600; }
</style>
</head>

<header class="topbar">

<main class="wrap" id="app"></main>

/* ============================================================
   채점 — 띄어쓰기와 조사 차이는 정답으로 본다.
   끝에 붙은 조사 하나만, 남는 길이가 2자 이상일 때만 떼어낸다.
   ============================================================ */

var JOSA = ["으로서", "으로써", "이라는", "에서는", "에게서", "으로", "로서", "로써", "에서", "에게",
            "까지", "부터", "이란", "라는", "은", "는", "이", "가", "을", "를", "의", "에", "와", "과", "도", "만", "로"];

function normalize(s) {
  if (s == null) return "";
  var t = String(s).trim().toLowerCase();
  t = t.replace(/\s+/g, "");
  t = t.replace(/[.,!?;·、。"'()\[\]<>{}]/g, "");
  for (var i = 0; i < JOSA.length; i++) {
    var j = JOSA[i];
    if (t.length - j.length >= 2 && t.slice(-j.length) === j) { t = t.slice(0, -j.length); break; }
  }
  return t;
}

function isCorrect(given, q) {
  var g = normalize(given);
  if (!g) return false;
  if (g === normalize(q.a)) return true;
  var alt = q.also || [];
  for (var i = 0; i < alt.length; i++) if (g === normalize(alt[i])) return true;
  return false;
}

/* ============================================================
   화면
   ============================================================ */

var TYPE_NAME = { choice: "객관식", ox: "OX", short: "주관식" };
var app = document.getElementById("app");

/* 문항 수는 손으로 적지 않는다 — 목록에서 직접 센다 */
document.getElementById("subtitle").textContent =
  "항해학 기초 · 해사법규 요약 · 선박 기관 기초 — 전 " + QUESTIONS.length + "문항";

var state = { ix: 0, given: null, checked: false, right: 0, log: [], done: false };

function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function questionText(text) {
  var p = el("p", "question");
  String(text).split("____").forEach(function (part, i) {
    if (i) p.appendChild(el("span", "blank", "____"));
    if (part) p.appendChild(document.createTextNode(part));
  });
  return p;
}

/* 해설 + 출처. 출처는 해설 끝에 붙는다. */
function explain(q) {
  var box = document.createDocumentFragment();
  var why = el("p", "why");
  why.style.margin = "0";
  String(q.why).split("자료에 없음").forEach(function (part, i) {
    if (i) why.appendChild(el("span", "nodata", "자료에 없음"));
    if (part) why.appendChild(document.createTextNode(part));
  });
  box.appendChild(why);
  box.appendChild(el("p", "src", "출처 · 실습파일/학습자료/" + q.src));
  return box;
}

function render() {
  app.innerHTML = "";
  if (state.done) { app.appendChild(viewResult()); return; }
  app.appendChild(viewQuestion());
}

function viewQuestion() {
  var q = QUESTIONS[state.ix];
  var box = el("section", "panel");

  /* 제목 바 */
  var head = el("header", "panel-head");
  head.appendChild(el("h2", null, "문제 풀이"));
  head.appendChild(el("span", "aside", "학습자료에서 출제"));
  box.appendChild(head);

  /* 진행 줄 */
  var prog = el("div", "progress");
  prog.appendChild(el("span", null, (state.ix + 1) + " / " + QUESTIONS.length));
  var track = el("div", "track");
  var fill = el("i");
  fill.style.width = (state.ix / QUESTIONS.length * 100) + "%";
  track.appendChild(fill);
  prog.appendChild(track);
  prog.appendChild(el("span", null, "정답 " + state.right));
  box.appendChild(prog);

  var body = el("div", "panel-body");

  /* 유형 배지 → 문제 → 보기 → 채점 결과 → 버튼 (디자인.md 3장 순서) */
  body.appendChild(el("span", "badge b-" + q.type, TYPE_NAME[q.type]));
  body.appendChild(questionText(q.q));

  if (q.type === "choice" || q.type === "ox") {
    var list = el("div", q.type === "ox" ? "ox" : "choices");
    var opts = q.type === "ox" ? ["O", "X"] : q.choices;
    opts.forEach(function (c, i) {
      var b = el("button", "choice");
      b.type = "button";
      if (q.type === "choice") b.appendChild(el("span", "ix", (i + 1) + "."));
      b.appendChild(el("span", null, c));
      if (state.checked) {
        b.disabled = true;
        var isAnswer = normalize(c) === normalize(q.a);
        var isPick = normalize(c) === normalize(state.given);
        if (isPick && isAnswer) b.className = "choice pick-right";
        else if (isPick) b.className = "choice pick-wrong";
        else if (isAnswer) b.className = "choice show-answer";
      } else {
        b.addEventListener("click", function () { submit(c); });
      }
      list.appendChild(b);
    });
    body.appendChild(list);
  } else {
    var row = el("div", "short-row");
    var input = document.createElement("input");
    input.type = "text";
    input.placeholder = "답을 입력하세요";
    if (state.checked) { input.value = state.given || ""; input.disabled = true; }
    row.appendChild(input);
    body.appendChild(row);
    if (!state.checked) {
      var r = el("div", "btn-row");
      var sb = el("button", "btn btn-primary", "제출");
      sb.type = "button";
      sb.addEventListener("click", function () { submit(input.value); });
      r.appendChild(sb);
      var sk = el("button", "btn", "모르겠습니다");
      sk.type = "button";
      sk.addEventListener("click", function () { submit(""); });
      r.appendChild(sk);
      body.appendChild(r);
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); submit(input.value); }
      });
      setTimeout(function () { try { input.focus(); } catch (e) {} }, 0);
    }
  }

  /* 채점 결과 — 글자·색·위치 세 가지로 알린다 (디자인.md 4장) */
  if (state.checked) {
    var ok = isCorrect(state.given, q);
    var v = el("div", "verdict " + (ok ? "right" : "wrong"));
    v.appendChild(el("div", "vh", ok ? "정답입니다" : "오답입니다"));
    var vb = el("div", "vb");

    var l1 = el("p", "line");
    l1.style.margin = "0";
    l1.appendChild(document.createTextNode("정답 · "));
    l1.appendChild(el("span", "ans", q.a));
    vb.appendChild(l1);

    if (!ok) {
      var l2 = el("p", "line");
      l2.style.margin = "0";
      if (String(state.given || "").trim()) {
        l2.appendChild(document.createTextNode("제출한 답 · "));
        l2.appendChild(el("span", "mine", state.given));
      } else {
        l2.appendChild(document.createTextNode("제출한 답 · 없음 (모르겠습니다)"));
      }
      vb.appendChild(l2);
    }

    if (q.type === "short") {
      vb.appendChild(el("p", "rule", "채점 기준 · 띄어쓰기와 조사 차이는 정답으로 처리합니다."));
    }

    vb.appendChild(explain(q));
    v.appendChild(vb);
    body.appendChild(v);

    var nr = el("div", "btn-row");
    var next = el("button", "btn btn-primary", state.ix + 1 >= QUESTIONS.length ? "결과 보기" : "다음 문제");
    next.type = "button";
    next.addEventListener("click", advance);
    nr.appendChild(next);
    body.appendChild(nr);
    setTimeout(function () { try { next.focus(); } catch (e) {} }, 0);
  }

  box.appendChild(body);
  return box;
}

function submit(given) {
  var q = QUESTIONS[state.ix];
  state.given = given;
  state.checked = true;
  var ok = isCorrect(given, q);
  if (ok) state.right++;
  state.log.push({ q: q, given: given, ok: ok });
  render();
}

function advance() {
  if (state.ix + 1 >= QUESTIONS.length) state.done = true;
  else { state.ix++; state.given = null; state.checked = false; }
  render();
}

function viewResult() {
  var frag = document.createDocumentFragment();
  var total = QUESTIONS.length;
  var wrong = state.log.filter(function (r) { return !r.ok; });

  var box = el("section", "panel");
  var head = el("header", "panel-head");
  head.appendChild(el("h2", null, "풀이 결과"));
  head.appendChild(el("span", "aside", "전 " + total + "문항"));
  box.appendChild(head);

  var body = el("div", "panel-body");
  var sc = el("div", "score");
  sc.appendChild(el("b", null, String(state.right)));
  sc.appendChild(el("span", null, "/ " + total + " 문항  ·  정답률 " + Math.round(state.right / total * 100) + "%"));
  body.appendChild(sc);

  var msg = el("p", "note");
  msg.style.marginBottom = "0";
  if (wrong.length) {
    msg.appendChild(document.createTextNode("틀린 문항 "));
    msg.appendChild(el("b", null, wrong.length + "개"));
    msg.appendChild(document.createTextNode("를 아래에 모았습니다. 해설과 출처를 보고 원문을 다시 확인하세요."));
  } else {
    msg.textContent = "틀린 문항이 없습니다.";
  }
  body.appendChild(msg);

  var r = el("div", "btn-row");
  var again = el("button", "btn btn-primary", "처음부터 다시 풀기");
  again.type = "button";
  again.addEventListener("click", function () {
    state = { ix: 0, given: null, checked: false, right: 0, log: [], done: false };
    render();
    window.scrollTo(0, 0);
  });
  r.appendChild(again);
  body.appendChild(r);
  box.appendChild(body);
  frag.appendChild(box);

  if (wrong.length) {
    var wb = el("section", "panel");
    var wh = el("header", "panel-head");
    wh.appendChild(el("h2", null, "틀린 문항 해설"));
    wh.appendChild(el("span", "aside", wrong.length + "건"));
    wb.appendChild(wh);
    var wbody = el("div", "panel-body");
    var ul = el("ul", "review");
    wrong.forEach(function (rec) {
      var li = el("li");
      li.appendChild(el("p", "rq", "[" + TYPE_NAME[rec.q.type] + "] " + rec.q.q));
      var l = el("p", "line");
      l.style.margin = "0";
      if (String(rec.given || "").trim()) {
        l.appendChild(document.createTextNode("제출한 답 · "));
        l.appendChild(el("span", "mine", rec.given));
        l.appendChild(document.createTextNode("   정답 · "));
      } else {
        l.appendChild(document.createTextNode("제출한 답 · 없음   정답 · "));
      }
      l.appendChild(el("span", "ans", rec.q.a));
      li.appendChild(l);
      li.appendChild(explain(rec.q));
      ul.appendChild(li);
    });
    wbody.appendChild(ul);
    wb.appendChild(wbody);
    frag.appendChild(wb);
  }

  return frag;
}

render();
</script>
